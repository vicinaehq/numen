name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Debug builds are sanitized (ASan + UBSan, see CMakeLists.txt), which
        # is a Linux concern: the other platforms build Release only
        include:
          - name: Linux / GCC / Release
            os: depot-ubuntu-24.04-4
            cc: gcc-14
            cxx: g++-14
            build_type: Release
          - name: Linux / GCC / Debug
            os: depot-ubuntu-24.04-4
            cc: gcc-14
            cxx: g++-14
            build_type: Debug
          - name: Linux / Clang / Release
            os: depot-ubuntu-24.04-4
            cc: clang-19
            cxx: clang++-19
            build_type: Release
          - name: Linux / Clang / Debug
            os: depot-ubuntu-24.04-4
            cc: clang-19
            cxx: clang++-19
            build_type: Debug
          - name: macOS / AppleClang
            os: depot-macos-26
            cc: clang
            cxx: clang++
            build_type: Release
          # builds Catch2 from source, hence the larger runner
          - name: Windows / MSVC
            os: depot-windows-2022-8
            cc: cl
            cxx: cl
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build catch2 ${{ matrix.cc }} ${{ matrix.cxx }}

      # the locale tests need real locale data, runners only ship C/en_US
      - name: Generate test locales (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen en_US fr_FR de_DE en_IN ja_JP.UTF-8
          sudo localedef -i ja_JP -f UTF-8 ja_JP || true
          locale -a

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja catch2

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          key: ${{ matrix.name }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTS=ON
          -DBUILD_REPL=ON
          -DBUILD_REPL_CURRENCY_PROVIDER=OFF
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  nix:
    name: Nix
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - name: Build and test
        run: nix build -L .
      - name: Check flake
        run: nix flake check -L
